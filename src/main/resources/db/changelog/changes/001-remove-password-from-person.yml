databaseChangeLog:
  - changeSet:
      id: 001-remove-password-from-person
      author: cascade
      preConditions:
        - onFail: MARK_RAN
          columnExists:
            tableName: person
            columnName: password
      comment: |
        Удаление поля password из таблицы person в рамках миграции на Authentication Service.
        После этой миграции аутентификация будет выполняться через отдельный микросервис.
      changes:
        - dropColumn:
            tableName: person
            columnName: password
      rollback:
        - addColumn:
            tableName: person
            columns:
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
