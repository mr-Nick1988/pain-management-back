spring:
  application:
    name: pain_helper_back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pain_management_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_type: string
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:noreply@painmanagement.local}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: pain-monolith-emr-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# JWT конфигурация (должен совпадать с Authentication Service)
jwt:
  secret: ${JWT_SECRET:pain-management-secret-key-change-in-production-min-256-bits-required-for-hs256-algorithm-security}

# Authentication Service интеграция
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082}
    timeout: ${AUTH_SERVICE_TIMEOUT:5000}

# Reporting Service интеграция
reporting:
  service:
    url: ${REPORTING_SERVICE_URL:http://localhost:8091}
    timeout: ${REPORTING_SERVICE_TIMEOUT:10000}

# Kafka topics configuration
kafka:
  topic:
    reporting-commands: ${KAFKA_TOPIC_REPORTING_COMMANDS:reporting-commands}
    analytics-events: ${KAFKA_TOPIC_ANALYTICS_EVENTS:analytics-events}

# Resilience4j Circuit Breaker для микросервисов
resilience4j:
  circuitbreaker:
    instances:
      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      reportingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
