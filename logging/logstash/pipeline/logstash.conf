# ==============================================================================
# Logstash Pipeline Configuration for Pain Management Platform
# ==============================================================================
# Purpose: Receive JSON logs from microservices and forward to Elasticsearch
# Input: TCP port 5000 (JSON), Beats port 5044 (Filebeat)
# Output: Elasticsearch index pattern: painmgmt-logs-{service}-YYYY.MM.DD
# ==============================================================================

input {
  # JSON logs from microservices via TCP
  tcp {
    port => 5000
    codec => json
    tags => ["microservice", "json"]
  }
  
  # Filebeat logs (if used)
  beats {
    port => 5044
    tags => ["filebeat"]
  }
}

filter {
  # Parse JSON if not already parsed
  if [message] and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Extract service name from logger name or application name
  if [logger_name] {
    grok {
      match => { "logger_name" => "com\.painmanagement\.%{WORD:service_short}" }
    }
  }
  
  # Extract trace IDs from message if present [service,traceId,spanId]
  if [message] {
    grok {
      match => { "message" => "\[%{DATA:service_name},%{DATA:trace_id},%{DATA:span_id}\]" }
      tag_on_failure => []
    }
  }
  
  # Normalize service name
  if [application_name] {
    mutate {
      add_field => { "service" => "%{application_name}" }
    }
  } else if [service_name] {
    mutate {
      add_field => { "service" => "%{service_name}" }
    }
  } else if [service_short] {
    mutate {
      add_field => { "service" => "%{service_short}" }
    }
  } else {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }
  
  # Normalize log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
  
  # Add timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
      target => "@timestamp"
    }
  }
  
  # Parse stack traces
  if [stack_trace] {
    mutate {
      gsub => [ "stack_trace", "\t", "  " ]
    }
  }
  
  # Add environment
  mutate {
    add_field => { "environment" => "development" }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "port", "host" ]
  }
}

output {
  # Output to Elasticsearch with daily indices per service
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "painmgmt-logs-%{service}-%{+YYYY.MM.dd}"
    
    # Template for index settings
    template_name => "painmgmt-logs"
    template_overwrite => true
  }
  
  # Debug output to console (disable in production)
  stdout {
    codec => rubydebug
  }
}
