# ============================================================================
# Pain Management Platform - Local Development Stack
# ============================================================================
# ЦЕЛЬ: Запуск всей инфраструктуры и микросервисов для локальной разработки
#
# АРХИТЕКТУРА:
# - Монолит (port 8080) - основная бизнес-логика
# - 6 микросервисов (8082-8089, 8091) - специализированные функции
# - Kafka - event streaming
# - PostgreSQL - основная БД (MongoDB удалена!)
#
# ИСПОЛЬЗОВАНИЕ ПРОФИЛЕЙ:
# docker-compose up                     # Только инфраструктура (Kafka, Postgres)
# docker-compose --profile all up       # Всё (инфраструктура + все микросервисы)
# docker-compose --profile core up      # Только критичные сервисы
# docker-compose --profile tools up     # Инфраструктура + инструменты (Kafdrop)
#
# ЛЕГКОВЕСНЫЕ ОБРАЗЫ:
# - postgres:16-alpine (~80MB вместо ~150MB)
# - Kafka на базе Confluent Platform
# - Все микросервисы с multi-stage builds
# ============================================================================

name: painmgmt-dev

services:
  # ==========================================================================
  # INFRASTRUCTURE: Apache Kafka (KRaft mode - без Zookeeper)
  # ==========================================================================
  # Event streaming платформа для асинхронного взаимодействия
  # Порт: 9092 (localhost), 29092 (внутри Docker сети)
  # KRaft = упрощенная архитектура без Zookeeper
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dev_kafka
    hostname: kafka
    ports:
      - "9092:9092"   # Доступ с хоста (монолит, IDE)
    environment:
      # KRaft configuration (без Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # Уникальный ID кластера
      
      # Listeners: внутри Docker (29092) + с хоста (9092) + controller (9093)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Performance settings для dev окружения
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # Автоматическое создание топиков
      
      # Log settings
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dev-net

  # ==========================================================================
  # INFRASTRUCTURE: PostgreSQL 16 (Alpine - легковесный образ ~80MB)
  # ==========================================================================
  # Основная БД для монолита и некоторых микросервисов
  # База: pain_management_db
  # Порт: 5432
  postgres:
    image: postgres:16-alpine  # Alpine = ~80MB вместо ~150MB обычного образа
    container_name: dev_postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pain_management_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Производительность для dev окружения
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pain_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # ==========================================================================
  # INFRASTRUCTURE: PostgreSQL для Reporting Service
  # ==========================================================================
  # Отдельная БД для аналитики и отчетов
  # База: analytics_reporting
  # Порт: 5433
  postgres-analytics:
    image: postgres:16-alpine
    container_name: dev_postgres_analytics
    hostname: postgres-analytics
    profiles: ["reporting", "all", "core"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: analytics_reporting
      POSTGRES_USER: ${POSTGRES_ANALYTICS_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-analytics}
    volumes:
      - postgres-analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_reporting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # ==========================================================================
  # API GATEWAY (порт 8000) - ЕДИНАЯ ТОЧКА ВХОДА
  # ==========================================================================
  # Все запросы от Frontend идут через API Gateway
  # Функции: routing, JWT validation, CORS, circuit breaker, rate limiting
  api-gateway:
    build:
      context: C:/backend_projects/microservices/api-gateway-service
      dockerfile: Dockerfile
    image: pain-mgmt/api-gateway:dev
    container_name: dev_api_gateway
    profiles: ["gateway", "all", "core"]
    ports:
      - "8000:8000"
    environment:
      # JWT Secret (должен совпадать со всеми сервисами!)
      JWT_SECRET: ${JWT_SECRET:-pain-management-secret-key-change-in-production-min-256-bits-required-for-hs256-algorithm-security}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      
      # Redis (опционально для rate limiting)
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # MICROSERVICE: Authentication Service (порт 8082)
  # ==========================================================================
  # JWT аутентификация и управление пользователями
  # База данных: auth_db (на host.docker.internal:5432)
  # Kafka: публикует события аутентификации
  auth-service:
    build:
      context: C:/backend_projects/microservices/authentication-service
      dockerfile: Dockerfile
    image: pain-mgmt/auth-service:dev
    container_name: dev_auth
    profiles: ["auth", "all", "core"]
    ports:
      - "8082:8082"
    environment:
      # Database (на хосте, не в Docker)
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-newpassword}
      
      # JWT Secret (должен совпадать с монолитом!)
      JWT_SECRET: ${JWT_SECRET:-pain-management-secret-key-change-in-production-min-256-bits-required-for-hs256-algorithm-security}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS,PATCH}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept,Origin,X-Requested-With}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
    depends_on:
      - postgres
    networks:
      - dev-net

  # ==========================================================================
  # MICROSERVICE: EMR Integration Service (порт 8086)
  # ==========================================================================
  # Интеграция с внешними EMR системами через FHIR R4
  # База данных: emr_integration_db
  # Kafka: публикует emr.changes, emr.created
  emr-service:
    build:
      context: C:/backend_projects/microservices/emr-integration-service
      dockerfile: Dockerfile
    image: pain-mgmt/emr-service:dev
    container_name: dev_emr
    profiles: ["emr", "all", "core"]
    ports:
      - "8086:8086"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/emr_integration_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # FHIR Server
      FHIR_SERVER_URL: ${FHIR_SERVER_URL:-http://hapi.fhir.org/baseR4}
      FHIR_CONNECTION_TIMEOUT: 10000
      FHIR_SOCKET_TIMEOUT: 10000
      
      # Sync settings
      EMR_SYNC_ENABLED: ${EMR_SYNC_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # MICROSERVICE: Notification Service (порт 8087)
  # ==========================================================================
  # Email, WebSocket, Push уведомления
  # База данных: notification_db
  # Kafka consumer: pain.escalated, dose.administered и др.
  notification-service:
    build:
      context: C:/backend_projects/microservices/notification-service
      dockerfile: Dockerfile
    image: pain-mgmt/notification-service:dev
    container_name: dev_notification
    profiles: ["notification", "all", "core"]
    ports:
      - "8087:8087"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # Email (для dev можно использовать MailHog)
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # MICROSERVICE: Pain Escalation Service (порт 8088)
  # ==========================================================================
  # Автоматическое отслеживание эскалации боли
  # База данных: pain_escalation_db
  # Kafka: публикует pain.escalated, dose.administered, vas.recorded
  pain-escalation-service:
    build:
      context: C:/backend_projects/microservices/pain-escalation-service
      dockerfile: Dockerfile
    image: pain-mgmt/pain-escalation:dev
    container_name: dev_pain_escalation
    profiles: ["escalation", "all", "core"]
    ports:
      - "8088:8088"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/pain_escalation_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # Escalation settings
      PAIN_ESCALATION_THRESHOLD: 2    # VAS increase to trigger escalation
      PAIN_ANALYSIS_WINDOW: 24         # Hours
      PAIN_CRITICAL_VAS: 7             # Critical pain level
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # MICROSERVICE: External VAS Integration Service (порт 8089)
  # ==========================================================================
  # Интеграция с внешними VAS устройствами (JSON/XML/CSV)
  # База данных: external_vas_db
  # Kafka: публикует vas.external.recorded
  external-vas-service:
    build:
      context: C:/backend_projects/microservices/external-vas-integration-service
      dockerfile: Dockerfile
    image: pain-mgmt/external-vas:dev
    container_name: dev_external_vas
    profiles: ["vas", "all"]
    ports:
      - "8089:8089"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/external_vas_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # VAS settings
      VAS_AUTO_RECOMMENDATION: 4       # VAS level to trigger auto-recommendation
      VAS_HIGH_PAIN: 7                 # High pain threshold
      API_KEY_LENGTH: 64               # API key length
      API_KEY_DEFAULT_RATE_LIMIT: 100  # Requests per minute
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # MICROSERVICE: Reporting Service (порт 8091)
  # ==========================================================================
  # Генерация отчетов и аналитика
  # База данных: analytics_reporting (отдельный PostgreSQL)
  # Kafka consumer: reporting-commands
  reporting-service:
    build:
      context: C:/backend_projects/microservices/reporting_service
      dockerfile: Dockerfile
    image: pain-mgmt/reporting:dev
    container_name: dev_reporting
    profiles: ["reporting", "all", "core"]
    ports:
      - "8091:8091"
    environment:
      # Database (standard Spring Boot properties)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analytics:5432/analytics_reporting
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_ANALYTICS_USER:-analytics}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-analytics}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      # Mail configuration (for dev - using fake SMTP or disabled)
      SPRING_MAIL_HOST: ${MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_REPORTING_COMMANDS: reporting-commands
      KAFKA_TOPICS_REPORTING_COMMANDS: reporting-commands
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # OPERATIONS: Backup & Restore Service (порт 8085)
  # ==========================================================================
  # Резервное копирование и восстановление баз данных
  # ВНИМАНИЕ: MongoDB удалена! Только PostgreSQL бэкапы
  backup-restore:
    build:
      context: C:/backend_projects/microservices/backup_restore
      dockerfile: Dockerfile
    image: pain-mgmt/backup-restore:dev
    container_name: dev_backup
    profiles: ["ops", "all"]
    ports:
      - "8085:8085"
    environment:
      # JPA store (история бэкапов)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backup_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # PostgreSQL target
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: pain_management_db
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # MongoDB REMOVED - больше не поддерживается!
      
      # Backup settings
      BACKUP_BASE_DIR: /app/backups
      BACKUP_RETENTION_DAYS: 30
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-false}
    volumes:
      - ./backups:/app/backups
    depends_on:
      - postgres
    networks:
      - dev-net

  # ==========================================================================
  # TOOLS: Kafdrop - Kafka UI (порт 9000)
  # ==========================================================================
  # Web UI для просмотра топиков, сообщений, consumer groups
  # Доступ: http://localhost:9000
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: dev_kafdrop
    profiles: ["tools", "all"]
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"  # Легковесный для dev окружения
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dev-net

  # ==========================================================================
  # OBSERVABILITY: Prometheus - Metrics Collection (порт 9090)
  # ==========================================================================
  # Сборщик метрик со всех сервисов через /actuator/prometheus
  # Web UI: http://localhost:9090
  # Легковесный образ: prom/prometheus (Alpine-based, ~200MB)
  prometheus:
    image: prom/prometheus:latest  # Alpine-based
    container_name: dev_prometheus
    profiles: ["monitoring", "all"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # Позволяет перезагружать конфиг без перезапуска
    networks:
      - dev-net

  # ==========================================================================
  # OBSERVABILITY: Grafana - Visualization (порт 3000)
  # ==========================================================================
  # Дашборды и визуализация метрик
  # Web UI: http://localhost:3000
  # Default credentials: admin/admin (изменить при первом входе)
  # Легковесный образ: grafana/grafana (Alpine-based, ~300MB)
  grafana:
    image: grafana/grafana:latest  # Alpine-based
    container_name: dev_grafana
    profiles: ["monitoring", "all"]
    ports:
      - "3000:3000"
    environment:
      # Admin credentials
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      
      # Disable analytics
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      
      # Performance для dev окружения
      GF_LOG_LEVEL: info
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning  # Автоматическая настройка datasources и dashboards
    depends_on:
      - prometheus
    networks:
      - dev-net

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  dev-net:
    driver: bridge
    name: painmgmt-dev-network

# ============================================================================
# VOLUMES (Persistent Data)
# ============================================================================
volumes:
  postgres-data:
    name: painmgmt-postgres-data
  postgres-analytics-data:
    name: painmgmt-analytics-data
  prometheus-data:
    name: painmgmt-prometheus-data
  grafana-data:
    name: painmgmt-grafana-data
  # MongoDB volume УДАЛЕН - больше не используется!

# ============================================================================
# USAGE EXAMPLES
# ============================================================================
# 
# 1. Запустить только инфраструктуру (Kafka + PostgreSQL):
#    docker-compose up
#
# 2. Запустить всё (инфраструктура + все микросервисы):
#    docker-compose --profile all up
#
# 3. Запустить критичные сервисы (инфраструктура + auth + emr + notification + reporting + escalation):
#    docker-compose --profile core up
#
# 4. Запустить с инструментами разработки (Kafdrop):
#    docker-compose --profile tools up
#
# 5. Запустить конкретный микросервис:
#    docker-compose --profile emr up
#
# 6. Остановить всё:
#    docker-compose --profile all down
#
# 7. Остановить и удалить volumes (ВНИМАНИЕ: удалит данные!):
#    docker-compose --profile all down -v
#
# 8. Пересобрать образы:
#    docker-compose --profile all build
#
# 9. Проверить конфигурацию:
#    docker-compose config
#
# ============================================================================
# KAFKA TOPICS (автоматически создаются)
# ============================================================================
# - analytics-events          # Бизнес-события от монолита
# - reporting-commands        # Команды для Reporting Service
# - emr.changes              # Изменения EMR от EMR Integration Service
# - emr.created              # Создание EMR записей
# - pain.escalated           # События эскалации боли
# - dose.administered        # Администрирование доз
# - vas.recorded             # Запись VAS (внутренняя)
# - vas.external.recorded    # Запись VAS (внешние устройства)
#
# ============================================================================
# PORTS SUMMARY
# ============================================================================
# API Gateway:
#   8000  - API Gateway (ЕДИНАЯ ТОЧКА ВХОДА для Frontend)
#
# Infrastructure:
#   5432  - PostgreSQL (монолит)
#   5433  - PostgreSQL Analytics
#   9092  - Kafka
#   9000  - Kafdrop (Kafka UI)
#
# Microservices:
#   8080  - Монолит (запускать отдельно через IDE или mvn spring-boot:run)
#   8082  - Authentication Service
#   8085  - Backup & Restore Service
#   8086  - EMR Integration Service
#   8087  - Notification Service
#   8088  - Pain Escalation Service
#   8089  - External VAS Integration Service
#   8091  - Reporting Service
#
# ============================================================================
