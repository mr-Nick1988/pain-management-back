name: painmgmt-dev

# Unified local development stack for Pain Management
# - Default brings up infrastructure (Kafka KRaft, Postgres, MongoDB)
# - Optional microservices can be enabled via compose profiles: analytics, auth, logging

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dev_kafka
    profiles: ["infra"]
    ports:
      - "9092:9092"   # host access (PLAINTEXT_HOST)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listeners: inside docker network and from host, plus controller listener
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dev-net

  # Optional job to ensure topics exist (will exit after creation)
  kafka-create-topics:
    image: confluentinc/cp-kafka:7.6.1
    profiles: ["infra"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-lc", "\
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic analytics-events --replication-factor 1 --partitions 1 && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic logging-events --replication-factor 1 --partitions 1 && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic emr.changes --replication-factor 1 --partitions 1 && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic emr.upserted --replication-factor 1 --partitions 1 && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic reporting-commands --replication-factor 1 --partitions 1 && \
      echo 'Kafka topics ensured' "]
    networks:
      - dev-net

  # =========================
  # Postgres (monolith + auth)
  # =========================
  postgres-main:
    image: postgres:16-alpine
    container_name: dev_postgres_main
    environment:
      POSTGRES_DB: pain_management_db
      POSTGRES_USER: ${PG_AUTH_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_AUTH_PASSWORD:-postgres}
    ports:
      - "5432:5432"   # monolith connects to localhost:5432
    volumes:
      - pg-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-net

  backup-restore:
    build:
      context: ../microservices/backup_restore
      dockerfile: Dockerfile
    container_name: backup-restore
    profiles: ["ops"]
    ports:
      - "8085:8085"
    environment:
      # JPA-хранилище истории (Postgres)
      SPRING_DATASOURCE_URL: ${BACKUP_DS_URL:-jdbc:postgresql://postgres-main:5432/backup_service}
      SPRING_DATASOURCE_USERNAME: ${BACKUP_DS_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${BACKUP_DS_PASS:-postgres}

      # Целевой Postgres для бэкапа/рестора
      PG_HOST: ${PG_HOST:-postgres-main}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-pain_management_db}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}

      # Целевой Mongo для бэкапа/рестора
      # Если у вас контейнер mongo в compose, используйте: mongodb://mongo:27017/painmanagement
      MONGODB_BACKUP_URI: ${MONGODB_BACKUP_URI:-mongodb://host.docker.internal:27017/painmanagement}

      # Пути к CLI (в Dockerfile уже установлены; оставьте по умолчанию)
      PG_DUMP_PATH: ${PG_DUMP_PATH:-pg_dump}
      PG_RESTORE_PATH: ${PG_RESTORE_PATH:-pg_restore}
      MONGO_DUMP_PATH: ${MONGO_DUMP_PATH:-mongodump}
      MONGO_RESTORE_PATH: ${MONGO_RESTORE_PATH:-mongorestore}

      # Директории и ретеншн
      BACKUP_BASE_DIR: ${BACKUP_BASE_DIR:-/app/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

      # Планировщик (по умолчанию выкл)
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-false}
    volumes:
      - ./backups/backup_restore:/app/backups
    depends_on:
      postgres-main:
        condition: service_started
    restart: unless-stopped
    networks:
      - dev-net

  postgres-analytics:
    image: postgres:16-alpine
    container_name: dev_postgres_analytics
    profiles: ["reporting"]
    environment:
      POSTGRES_DB: analytics_reporting
      POSTGRES_USER: ${PG_USER:-analytics}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-analytics}
    ports:
      - "5433:5432"
    volumes:
      - pg-analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-net

  # =========================
  # Optional microservices (enable via profiles)
  # =========================
  external-emr:
    image: external-emr:dev
    build:
      context: C:/backend_projects/microservices/external_emr
    container_name: dev_external_emr
    profiles: ["emr"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      EMR_CHANGES_TOPIC: ${EMR_CHANGES_TOPIC:-emr.changes}
      EMR_UPSERTED_TOPIC: ${EMR_UPSERTED_TOPIC:-emr.upserted}
      EMR_SYNC_ENABLED: ${EMR_SYNC_ENABLED:-false}
      FHIR_SERVER_URL: ${FHIR_SERVER_URL:-http://hapi.fhir.org/baseR4}
      FHIR_CONNECTION_TIMEOUT: ${FHIR_CONNECTION_TIMEOUT:-10000}
      FHIR_SOCKET_TIMEOUT: ${FHIR_SOCKET_TIMEOUT:-10000}
      SERVER_PORT: 8086
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - dev-net
  reporting-service:
    image: reporting-service:dev
    build:
      context: C:/backend_projects/microservices/reporting_service
    container_name: dev_reporting
    profiles: ["reporting"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_REPORTING_COMMANDS: ${KAFKA_TOPIC_REPORTING_COMMANDS:-reporting-commands}
      KAFKA_TOPICS_REPORTING_COMMANDS: ${KAFKA_TOPICS_REPORTING_COMMANDS:-reporting-commands}
      SPRING_KAFKA_CONSUMER_GROUP_ID: analytics-reporting-group
      SERVER_PORT: 8091
      PG_JDBC_URL: jdbc:postgresql://postgres-analytics:5432/analytics_reporting
      PG_USER: ${PG_USER:-analytics}
      PG_PASSWORD: ${PG_PASSWORD:-analytics}
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_started
    ports:
      - "8091:8091"
    networks:
      - dev-net

  authentication-service:
    image: authentication-service:dev
    build:
      context: C:/backend_projects/microservices/authentication-service
    container_name: dev_authentication
    profiles: ["auth"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/auth_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-newpassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8082:8082"
    networks:
      - dev-net

  logging-service:
    image: logging-service:dev
    build:
      context: C:/backend_projects/microservices/logging-service
    container_name: dev_logging
    profiles: ["logging"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_MONGODB_URI: ${LOGGING_MONGODB_URI:-mongodb://mongo:27017/logging_db}
      KAFKA_TOPIC_LOGGING_EVENTS: ${KAFKA_TOPIC_LOGGING_EVENTS:-logging-events}
      SPRING_KAFKA_CONSUMER_GROUP_ID: logging-service-group
      SERVER_PORT: 8083
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      - "8081:8083"
    networks:
      - dev-net

  mongo:
    image: mongo:7.0
    container_name: dev_mongo
    profiles: ["logging"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dev-net

  # =========================
  # Optional tools
  # =========================
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: dev_kafdrop
    profiles: ["tools"]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: -Xms32M -Xmx64M
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge

volumes:
  pg-main-data:
  pg-analytics-data:
  mongo-data:
